<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulsePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, -40px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 35px) scale(1.1); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pingNode {
      0%, 100% { r: 5px; opacity: 0.9; }
      50% { r: 9px; opacity: 0.4; }
    }

    .orb-1 { animation: floatOrb1 12s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 10s ease-in-out infinite; }
    .pulse-line { animation: dashCycle 6s linear infinite; }
    .glowing-bg { animation: pulseGlow 5s ease-in-out infinite; }
    .pill-1 { animation: floatPill 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill 4.5s ease-in-out 0.5s infinite; }
    .pill-3 { animation: floatPill 4.2s ease-in-out 1s infinite; }
    .pill-4 { animation: floatPill 4.8s ease-in-out 1.5s infinite; }
    .pill-5 { animation: floatPill 4.4s ease-in-out 0.8s infinite; }
    .node-ping { animation: pingNode 2.5s ease-in-out infinite; }

    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 600;
    }
  </style>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- 2. Grid Pattern (Subtle) -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- 3. Dynamic Animated Ambient Background Orbs -->
  <g class="glowing-bg">
    <circle cx="180" cy="100" r="140" fill="url(#pulseCyan)" class="orb-1" filter="url(#glow)" />
    <circle cx="1020" cy="300" r="160" fill="url(#pulsePurple)" class="orb-2" filter="url(#glow)" />
  </g>

  <!-- 4. Dynamic Changelog Versioning Network Graph Lines (in background) -->
  <g stroke-width="2" fill="none" opacity="0.45">
    <!-- Main timeline pipeline -->
    <path d="M 80 340 L 320 340 L 480 340 L 720 340 L 940 340 L 1120 340" stroke="#334155" stroke-width="3" />
    <path d="M 80 340 L 320 340 L 480 340 L 720 340 L 940 340 L 1120 340" stroke="url(#primaryGrad)" stroke-dasharray="16 10" class="pulse-line" stroke-width="3" />

    <!-- Feature Branch / Breaking Change Release Curve -->
    <path d="M 320 340 C 370 290, 430 290, 480 290 L 720 290 C 770 290, 830 340, 880 340" stroke="#818cf8" stroke-dasharray="6 6" />
  </g>

  <!-- Version Nodes on Timeline -->
  <g>
    <!-- v1.0 Node -->
    <circle cx="320" cy="340" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="320" cy="340" r="5" fill="#38bdf8" />
    <text x="320" y="375" fill="#94a3b8" font-size="12" text-anchor="middle" class="font-mono">v1.2.0</text>

    <!-- v2.0 Branch Node -->
    <circle cx="480" cy="290" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <circle cx="480" cy="290" r="4" fill="#818cf8" />
    <text x="480" y="270" fill="#a5b4fc" font-size="11" text-anchor="middle" class="font-mono">beta</text>

    <!-- Milestone Node (Active Ping) -->
    <circle cx="720" cy="340" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="720" cy="340" r="6" fill="#c084fc" class="node-ping" filter="url(#subtleGlow)" />
    <text x="720" y="375" fill="#c084fc" font-size="12" text-anchor="middle" class="font-mono">v2.0.0 (Latest)</text>

    <!-- Future Release Node -->
    <circle cx="940" cy="340" r="10" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <circle cx="940" cy="340" r="4" fill="#64748b" />
    <text x="940" y="375" fill="#64748b" font-size="12" text-anchor="middle" class="font-mono">v2.1.0-rc</text>
  </g>

  <!-- 5. Foreground Content: Header Badge -->
  <g transform="translate(600, 55)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="-112" cy="0" r="4" fill="#34d399" />
    <text x="-98" y="5" fill="#e2e8f0" font-size="12" class="font-mono" letter-spacing="1.2">CURATED AWESOME LIST</text>
  </g>

  <!-- 6. Foreground Title & Subtitle (High contrast, guaranteed readable) -->
  <g transform="translate(600, 130)">
    <text x="0" y="0" text-anchor="middle" font-size="46" fill="url(#primaryGrad)" class="font-title" filter="url(#subtleGlow)">
      Awesome API Changelog
    </text>
    <text x="0" y="50" text-anchor="middle" font-size="34" fill="#f8fafc" class="font-title">
      &amp; Version History
    </text>
    <text x="0" y="90" text-anchor="middle" font-size="16" fill="#94a3b8" class="font-sub">
      Public Roadmaps • In-App Widgets • Automated Release Notes • Self-Hosted Feedback Boards
    </text>
  </g>

  <!-- 7. Dynamic Floating Feature Badges / Pills (in lower midground, non-overlapping) -->
  <!-- Pill 1: SaaS & In-App Widgets -->
  <g class="pill-1" transform="translate(180, 240)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="5" fill="#38bdf8" font-size="12" text-anchor="middle" class="font-mono">🚀 In-App Widgets</text>
  </g>

  <!-- Pill 2: Breaking Changes -->
  <g class="pill-2" transform="translate(380, 240)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="5" fill="#a5b4fc" font-size="12" text-anchor="middle" class="font-mono">⚡ Breaking Changes</text>
  </g>

  <!-- Pill 3: Git-Driven CLI -->
  <g class="pill-3" transform="translate(600, 240)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="5" fill="#6ee7b7" font-size="12" text-anchor="middle" class="font-mono">📦 CI/CD Automation</text>
  </g>

  <!-- Pill 4: Public Roadmaps -->
  <g class="pill-4" transform="translate(820, 240)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="5" fill="#f472b6" font-size="12" text-anchor="middle" class="font-mono">🗺️ Public Roadmaps</text>
  </g>

  <!-- Pill 5: Self-Hosted -->
  <g class="pill-5" transform="translate(1020, 240)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="5" fill="#d8b4fe" font-size="12" text-anchor="middle" class="font-mono">🔒 Self-Hosted</text>
  </g>

  <!-- Subtle Border Line -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
</svg>
